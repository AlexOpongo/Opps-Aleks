<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - School Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <h1>School Management System</h1>
    </header>

    <nav>
        <a href="Index.html">Dashboard</a>
        <a href="student.html">Students</a>
        <a href="teachers.html">Teachers</a>
        <a href="subjects.html">Subjects</a>
        <a href="results.html">Results</a>
        </nav>
        <main>
            <h2>Teachers Management</h2>

         <form id="teachersForm">
               <input type="text" id="teacherName" placeholder="Enter teacher name" required><br><br>
                <input type="text" id="teacherId" placeholder="Enter teacher ID" required><br><br>
                <input type="tel" id="phoneTaught" placeholder="Enter phone number" required><br><br>
                <select id="teacherSubject" required>
                    <option value="">Select Subject</option>
                    <option>Mathematics</option>
                    <option>Chemistry</option>
                    <option>English</option>
                    <option>Economics</option>
                    <option>Biology</option>
                    <option>Geography</option>
                    <option>History</option>
                </select><br><br>

                <select id="teacherGender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select><br><br>
                <button type="submit">Add Teacher</button>
            </form>

            <h2>Registered Teachers</h2>
            <table id="teachersTable">
                <thead>
                    <tr>
                        <th>Teacher ID</th>
                        <th>Teacher Name</th>
                        <th>Phone Number</th>
                        <th>Subject Taught</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </main>
         <footer>
                     <p>2026 School Management System</p>
    </footer>


</body>
</html>
