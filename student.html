<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-School Management System</title>
     <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <h1>School Management System</h1>
    </header>

    <nav>
        <a href="Index.html">Dashboard</a>
        <a href="student.html">Students</a>
        <a href="teachers.html">Teachers</a>
        <a href="subjects.html">Subjects</a>
        </nav>

        <main>
            <h2>Student Management</h2>

            <form id="studentForm">
                
                <input type="text" id="studentName" placeholder="Enter student name" required><br><br>
                
                <input type="text" id="registrationNumber" placeholder="Enter registration number" required><br><br>
                
                <input type="text" id="studentId" placeholder="Enter student ID" required><br><br>
                
                <select id="className">
                    <option> Class</option>
                    <option>Senior One</option>
                    <option>Senior Two</option>
                    <option>Senior Three</option>
                    <option>Senior Four</option>
                    <option>Senior Five</option>
                    <option>Senior Six</option>
                </select><br><br>

                <select id="gender">
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select><br><br>

                <input type="tel" id="phone" placeholder="Enter parent phone number" required>
                <br><br>
                <button type="submit">Register Student</button>
            </form>

            <h2>Registered Students</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Registration Number</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Gender</th>
                        <th>Parent Phone</th>
                         <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList">
                </tbody>
            </table>
        </main>

        <footer>
            <p>2026 School Management System</p>
        </footer>

</body>
</html>
