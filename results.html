<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results-School Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <h1>School Management System</h1>
    </header>

    <nav>
        <a href="Index.html">Dashboard</a>
        <a href="student.html">Students</a>
        <a href="teachers.html">Teachers</a>
        <a href="subjects.html">Subjects</a>
        <a href="results.html">Results</a>
        </nav>

        <main>
            <h2>Student Results Management</h2>

            <form id="resultsForm">
                <select id="studentName" required>
                    <option value="">Select Student</option>
                </select><br><br>
                <select id="subject" required>
                    <option value="">Select Subject</option>
                </select><br><br>
                <input type="number" id="marks" placeholder="Enter marks (0-100)" min="0" max="100" required><br><br>
                <input type="text" id="grade" placeholder="Grade (A-F)" required><br><br>
                <button type="submit">Save Result</button>
            </form>

            <h2>Registered Results</h2>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
                </table>

        </main>

        <footer>
            <p>2026 School Management System</p>
        </footer>

    </body>
</html>
